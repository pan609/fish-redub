# 通过系统文件选择器导入测试音频
# 参数：FILE_IOS（iOS 文件选择器中显示的名称，不含扩展名）、FILE_ANDROID（含扩展名）
appId: com.pany05.redub
---
- tapOn:
    id: step.audio.import
- runFlow:
    when:
      platform: iOS
    commands:
      # 选择器会记住上次的文件夹；用搜索定位文件，避免列表需要滚动
      - extendedWaitUntil:
          visible: "搜索"
          timeout: 10000
      - tapOn:
          text: "搜索"
          index: 0
      - inputText: "${FILE_IOS}"
      # 收起键盘后搜索结果才会出现在可访问层级中
      - pressKey: Enter
      - waitForAnimationToEnd
      # 选择器运行在独立进程，搜索后结果不在可访问层级中；
      # 搜索后第一个结果的位置固定，按相对坐标点击
      - tapOn:
          point: "18%,42%"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "RedubTest|${FILE_ANDROID}|Recent"
          timeout: 10000
      - runFlow:
          when:
            notVisible: "${FILE_ANDROID}"
          commands:
            - runFlow:
                when:
                  notVisible: "RedubTest"
                commands:
                  - tapOn:
                      id: ".*roots.*|.*drawer.*"
                      optional: true
                  - tapOn:
                      text: "Show roots"
                      optional: true
                  - tapOn: "Downloads"
            - tapOn: "RedubTest"
      - tapOn: "${FILE_ANDROID}"
